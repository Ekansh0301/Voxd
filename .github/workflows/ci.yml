name: CI

# Static checks and unit tests only. The runtime needs a GPU, a microphone and
# local models, none of which exist on GitHub-hosted runners.
# Tool versions come from pyproject.toml [project.optional-dependencies].dev.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tars:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install TARS with dev tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check . --output-format=github
      - name: Formatting (black)
        run: black --check .
      - name: Types (mypy)
        run: mypy tars bench tests
      - name: Unit tests
        run: pytest tests

  legacy:
    # The v1 prototype in legacy/ is kept as a baseline until TARS replaces it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6==6.6.1 pytest==8.3.4 psutil==5.9.6 requests==2.31.0
      - name: Compile
        run: python -m compileall -q legacy
      - name: Unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest legacy/tests
