name: CI

# Static checks and unit tests only. The runtime needs a GPU, a microphone and
# local models, none of which exist on GitHub-hosted runners.
# Tool versions come from pyproject.toml [project.optional-dependencies].dev.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tars:
    runs-on: ubuntu-26.04  # the release TARS targets
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install TARS with dev tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check . --output-format=github
      - name: Formatting (black)
        run: black --check .
      - name: Types (mypy)
        run: mypy tars bench tests
      - name: Unit tests
        run: pytest tests
