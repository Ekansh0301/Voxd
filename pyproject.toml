[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tars"
version = "0.3.0"  # = the roadmap phase reached
description = "TARS: a local, hands-free desktop agent for Ubuntu that runs on a 4 GB GPU"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Ekansh Goyal"}]
keywords = ["voice-assistant", "local-ai", "desktop-agent", "llama.cpp", "mcp", "live2d"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
]
# The TARS environment (.venv). v1's legacy/ has its own requirements and venv/.
dependencies = [
    "numpy>=2.0.2,<3",
    "httpx==0.28.1",
    "PyYAML==6.0.3",
    "sounddevice==0.5.2",
    "soundfile==0.13.1",
    "faster-whisper==1.2.1",
    "piper-tts==1.4.2",
    "kokoro-onnx==0.6.1",
    "websockets==15.0.1",
    "PyQt6==6.11.0",
    "PyQt6-WebEngine==6.11.0",
    "jeepney==0.9.0",
    "Pillow==12.3.0",  # screenshots: OCR, vision, screen checks
]

[project.optional-dependencies]
bench = ["nvidia-ml-py", "jiwer"]
# GPU Whisper needs cuDNN 9. setup.sh installs it with --no-deps, because its cuBLAS
# dependency (~450 MB) duplicates the CUDA 12.x toolkit's cuBLAS already on the system.
gpu-stt = ["nvidia-cudnn-cu12>=9,<10"]
dev = [
    "pytest==8.3.4",
    "black==25.1.0",
    "ruff==0.15.19",
    "mypy==1.14.1",
    "types-requests==2.33.0.20260408",
]

[project.urls]
Repository = "https://github.com/Ekansh0301/Voxd"

[tool.setuptools.packages.find]
include = ["tars*"]

[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = '''/(venv|\.venv|legacy/piper_bin)/'''

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false
exclude = ["^venv/", "^\\.venv/"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]  # legacy: venv/bin/python -m pytest legacy/tests
addopts = "-q --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["venv", ".venv", "legacy/piper_bin"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
]
ignore = [
    "E501",  # line too long (handled by black)
    "C901",  # function complexity — tracked as future refactor, not a bug
    "B905",  # zip() without strict= — stylistic, not a correctness issue
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports
# entry points set up the environment (CUDA libs, Qt platform) before importing
"tars/voice/__main__.py" = ["E402"]
"tars/ui/__main__.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["tars", "bench", "core"]
